---
- name: Install K3s Server
  hosts: master
  become: true
  gather_facts: true

  tasks:

    - name: Install K3s server
      shell: |
        curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s API
      wait_for:
        port: 6443
        timeout: 300

    - name: Read K3s node token
      command: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token
      changed_when: false

    - name: Store token for worker nodes
      set_fact:
        cluster_token: "{{ k3s_token.stdout }}"

- name: Join Worker Nodes
  hosts: workers
  become: true
  gather_facts: true

  vars:
    master_private_ip: "{{ hostvars[groups['master'][0]]['k3s_private_ip'] }}"

  tasks:

    - name: Install K3s agent
      shell: |
        curl -sfL https://get.k3s.io | \
        K3S_URL=https://{{ master_private_ip }}:6443 \
        K3S_TOKEN={{ hostvars[groups['master'][0]]['cluster_token'] }} \
        sh -
      args:
        creates: /usr/local/bin/k3s-agent-uninstall.sh
